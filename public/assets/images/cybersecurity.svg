<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="sec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sec-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="sec-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#sec-bg)"/>

  <!-- Hexagonal Grid in Background -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1" fill="none">
    <polygon points="60,30 90,45 90,75 60,90 30,75 30,45"/>
    <polygon points="120,30 150,45 150,75 120,90 90,75 90,45"/>
    <polygon points="180,30 210,45 210,75 180,90 150,75 150,45"/>
    <polygon points="90,75 120,90 120,120 90,135 60,120 60,90"/>
    <polygon points="150,75 180,90 180,120 150,135 120,120 120,90"/>
  </g>

  <!-- Left: Security Radar & Firewall Console -->
  <g transform="translate(60, 55)" filter="url(#sec-shadow)">
    <rect x="0" y="0" width="220" height="250" rx="12" fill="#090D16" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="32" rx="12" fill="#1E293B"/>
    <text x="14" y="21" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">FIREWALL SENTINEL</text>

    <!-- Radar circles -->
    <circle cx="110" cy="100" r="50" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
    <circle cx="110" cy="100" r="32" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="110" cy="100" r="14" fill="#0284C7" opacity="0.3"/>
    <line x1="110" y1="50" x2="110" y2="150" stroke="#1E3A8A" stroke-width="1"/>
    <line x1="60" y1="100" x2="160" y2="100" stroke="#1E3A8A" stroke-width="1"/>
    <!-- Blip -->
    <circle cx="125" cy="85" r="4" fill="#10B981"/>

    <!-- Terminal logs -->
    <g font-family="monospace" font-size="10">
      <text x="14" y="175" fill="#10B981">&gt; Port 443 [TLS 1.3] SECURE</text>
      <text x="14" y="195" fill="#38BDF8">&gt; Encryption: AES-256 GCM</text>
      <text x="14" y="215" fill="#EF4444">&gt; 0 Vulnerabilities Detected</text>
      <text x="14" y="235" fill="#94A3B8">&gt; System Integrity: 100%</text>
    </g>
  </g>

  <!-- Right: Big Shield with Padlock -->
  <g transform="translate(340, 50)" filter="url(#sec-shadow)">
    <!-- Shield Path -->
    <path d="M 100 20 L 190 55 C 190 145 150 205 100 240 C 50 205 10 145 10 55 Z" fill="url(#sec-shield)"/>
    
    <!-- Shield Inner Inset -->
    <path d="M 100 35 L 175 65 C 175 140 142 190 100 220 C 58 190 25 140 25 65 Z" fill="#0F172A" opacity="0.4"/>

    <!-- Glowing Padlock -->
    <g transform="translate(68, 85)">
      <!-- Lock Shackle -->
      <path d="M 18 30 L 18 18 C 18 6 46 6 46 18 L 46 30" fill="none" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
      <!-- Lock Body -->
      <rect x="0" y="28" width="64" height="50" rx="10" fill="#EAB308"/>
      <!-- Keyhole -->
      <circle cx="32" cy="48" r="6" fill="#713F12"/>
      <polygon points="29,50 35,50 33,64 31,64" fill="#713F12"/>
    </g>

    <!-- Certificate Ribbon -->
    <rect x="15" y="250" width="170" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="100" y="269" fill="#E0F2FE" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🛡️ Ethical Hacking &amp; Crypto</text>
  </g>
</svg>
