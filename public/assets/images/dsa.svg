<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="dsa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="dsa-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="dsa-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="dsa-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#dsa-bg)"/>

  <!-- Graph / Tree Network in Center-Left -->
  <g transform="translate(60, 45)" filter="url(#dsa-shadow)">
    <!-- Edges -->
    <line x1="160" y1="40" x2="90" y2="110" stroke="#818CF8" stroke-width="3" stroke-dasharray="4,4"/>
    <line x1="160" y1="40" x2="230" y2="110" stroke="#818CF8" stroke-width="3"/>
    <line x1="90" y1="110" x2="50" y2="180" stroke="#818CF8" stroke-width="3"/>
    <line x1="90" y1="110" x2="130" y2="180" stroke="#818CF8" stroke-width="3"/>
    <line x1="230" y1="110" x2="190" y2="180" stroke="#818CF8" stroke-width="3"/>
    <line x1="230" y1="110" x2="270" y2="180" stroke="#818CF8" stroke-width="3"/>

    <!-- Nodes -->
    <!-- Root -->
    <circle cx="160" cy="40" r="24" fill="url(#dsa-gold)"/>
    <text x="160" y="46" fill="#1E1B4B" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" text-anchor="middle">50</text>

    <!-- Level 1 -->
    <circle cx="90" cy="110" r="20" fill="url(#dsa-node)"/>
    <text x="90" y="115" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">25</text>

    <circle cx="230" cy="110" r="20" fill="url(#dsa-node)"/>
    <text x="230" y="115" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">75</text>

    <!-- Level 2 -->
    <circle cx="50" cy="180" r="18" fill="url(#dsa-node)"/>
    <text x="50" y="185" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">10</text>

    <circle cx="130" cy="180" r="18" fill="url(#dsa-node)"/>
    <text x="130" y="185" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">35</text>

    <circle cx="190" cy="180" r="18" fill="url(#dsa-node)"/>
    <text x="190" y="185" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">60</text>

    <circle cx="270" cy="180" r="18" fill="url(#dsa-node)"/>
    <text x="270" y="185" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">90</text>

    <!-- Array Representation below Tree -->
    <g transform="translate(10, 225)">
      <rect x="0" y="0" width="300" height="38" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
      <line x1="50" y1="0" x2="50" y2="38" stroke="#6366F1"/>
      <line x1="100" y1="0" x2="100" y2="38" stroke="#6366F1"/>
      <line x1="150" y1="0" x2="150" y2="38" stroke="#6366F1"/>
      <line x1="200" y1="0" x2="200" y2="38" stroke="#6366F1"/>
      <line x1="250" y1="0" x2="250" y2="38" stroke="#6366F1"/>
      <text x="25" y="24" fill="#C7D2FE" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">10</text>
      <text x="75" y="24" fill="#C7D2FE" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">25</text>
      <text x="125" y="24" fill="#C7D2FE" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">35</text>
      <text x="175" y="24" fill="#FDE047" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">50</text>
      <text x="225" y="24" fill="#C7D2FE" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">75</text>
      <text x="275" y="24" fill="#C7D2FE" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">90</text>
    </g>
  </g>

  <!-- Algorithm / Complexity Card on Right -->
  <g transform="translate(370, 50)" filter="url(#dsa-shadow)">
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#0F172A" stroke="#4338CA" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="34" rx="12" fill="#1E1B4B"/>
    <rect x="0" y="20" width="180" height="14" fill="#1E1B4B"/>
    <text x="14" y="23" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">COMPLEXITY</text>

    <!-- Table of complexities -->
    <g font-family="monospace" font-size="11">
      <text x="14" y="62" fill="#94A3B8">Binary Search</text>
      <text x="14" y="78" fill="#34D399" font-weight="bold">O(log n)</text>

      <line x1="14" y1="92" x2="166" y2="92" stroke="#334155"/>

      <text x="14" y="112" fill="#94A3B8">Merge Sort</text>
      <text x="14" y="128" fill="#38BDF8" font-weight="bold">O(n log n)</text>

      <line x1="14" y1="142" x2="166" y2="142" stroke="#334155"/>

      <text x="14" y="162" fill="#94A3B8">Hash Map</text>
      <text x="14" y="178" fill="#FBBF24" font-weight="bold">O(1) Avg</text>

      <line x1="14" y1="192" x2="166" y2="192" stroke="#334155"/>

      <text x="14" y="212" fill="#94A3B8">Graph DFS/BFS</text>
      <text x="14" y="228" fill="#F43F5E" font-weight="bold">O(V + E)</text>
    </g>
  </g>
</svg>
