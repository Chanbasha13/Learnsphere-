<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="py-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="py-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#py-bg)"/>

  <!-- Subtle Matrix Pattern -->
  <g opacity="0.08" fill="#5EEAD4" font-family="monospace" font-size="12">
    <text x="30" y="40">def analyze_data(dataset):</text>
    <text x="30" y="80">import pandas as pd</text>
    <text x="30" y="120">import numpy as np</text>
    <text x="30" y="160">class NeuralNet:</text>
    <text x="30" y="200">yield [x**2 for x in nums]</text>
    <text x="30" y="240">@property</text>
    <text x="30" y="280">async def fetch_api():</text>
    <text x="30" y="320">return True</text>
  </g>

  <!-- Glowing Aura -->
  <circle cx="450" cy="180" r="130" fill="#2DD4BF" opacity="0.15" filter="blur(25px)"/>

  <!-- Code Card Terminal -->
  <g filter="url(#py-shadow)">
    <!-- Terminal Box -->
    <rect x="60" y="60" width="310" height="240" rx="12" fill="#0F172A"/>
    <!-- Terminal Header -->
    <rect x="60" y="60" width="310" height="32" rx="12" fill="#1E293B"/>
    <rect x="60" y="80" width="310" height="12" fill="#1E293B"/>
    <circle cx="80" cy="76" r="5" fill="#EF4444"/>
    <circle cx="96" cy="76" r="5" fill="#F59E0B"/>
    <circle cx="112" cy="76" r="5" fill="#10B981"/>
    <text x="135" y="80" fill="#94A3B8" font-family="monospace" font-size="11">python_app.py</text>

    <!-- Code Text -->
    <g font-family="monospace" font-size="12">
      <text x="80" y="120" fill="#F43F5E">def <tspan fill="#38BDF8">solve_problem</tspan>(data):</text>
      <text x="100" y="145" fill="#64748B"># Clean &amp; process</text>
      <text x="100" y="170" fill="#F8FAFC">result = [x * 2 <tspan fill="#F43F5E">for</tspan> x <tspan fill="#F43F5E">in</tspan> data]</text>
      <text x="100" y="195" fill="#F43F5E">return <tspan fill="#F8FAFC">sorted(result)</tspan></text>
      <text x="80" y="230" fill="#34D399">&gt;&gt;&gt; <tspan fill="#F8FAFC">solve_problem([3, 1, 2])</tspan></text>
      <text x="80" y="255" fill="#FDE047">[2, 4, 6] <tspan fill="#10B981">✓ PASSED</tspan></text>
    </g>
  </g>

  <!-- Big Python Emblem Representation -->
  <g transform="translate(390, 80)" filter="url(#py-shadow)">
    <!-- Top Blue Snake Loop -->
    <path d="M 90 20 C 50 20 50 40 50 40 L 50 70 L 95 70 L 95 85 L 30 85 C 30 85 0 85 0 130 C 0 175 30 175 30 175 L 50 175 L 50 150 C 50 120 70 120 70 120 L 115 120 C 115 120 140 120 140 90 L 140 45 C 140 20 90 20 90 20 Z" fill="url(#py-blue)"/>
    <circle cx="70" cy="45" r="7" fill="#FFFFFF"/>

    <!-- Bottom Yellow Snake Loop -->
    <path d="M 60 210 C 100 210 100 190 100 190 L 100 160 L 55 160 L 55 145 L 120 145 C 120 145 150 145 150 100 C 150 55 120 55 120 55 L 100 55 L 100 80 C 100 110 80 110 80 110 L 35 110 C 35 110 10 110 10 140 L 10 185 C 10 210 60 210 60 210 Z" fill="url(#py-yellow)"/>
    <circle cx="80" cy="185" r="7" fill="#1E293B"/>
  </g>

  <!-- Feature Tags -->
  <g transform="translate(385, 270)">
    <rect x="0" y="0" width="160" height="32" rx="6" fill="#134E4A" stroke="#2DD4BF" stroke-width="1"/>
    <text x="15" y="21" fill="#CCFBF1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">⚡ Python 3.12 + OOP</text>
  </g>
</svg>
