<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ui-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE185D"/>
      <stop offset="50%" stop-color="#9D174D"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="ui-phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ui-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="ui-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4c0519" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#ui-bg)"/>

  <!-- Left: Design Palette & Tooling -->
  <g transform="translate(60, 50)" filter="url(#ui-shadow)">
    <!-- Palette Card -->
    <rect x="0" y="0" width="220" height="255" rx="14" fill="#FFFFFF"/>
    <text x="20" y="32" fill="#1E293B" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Design Tokens</text>
    
    <!-- Color Swatches -->
    <g transform="translate(20, 50)">
      <circle cx="20" cy="20" r="18" fill="#4F46E5"/>
      <circle cx="65" cy="20" r="18" fill="#EC4899"/>
      <circle cx="110" cy="20" r="18" fill="#06B6D4"/>
      <circle cx="155" cy="20" r="18" fill="#10B981"/>
    </g>

    <!-- Typography scale -->
    <text x="20" y="115" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">TYPOGRAPHY</text>
    <text x="20" y="140" fill="#0F172A" font-family="-apple-system, sans-serif" font-weight="800" font-size="20">Display Title</text>
    <text x="20" y="165" fill="#334155" font-family="-apple-system, sans-serif" font-weight="600" font-size="14">Subheading Medium</text>
    <text x="20" y="185" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">Body copy text with ideal contrast</text>

    <!-- Design Metrics -->
    <rect x="20" y="205" width="180" height="32" rx="6" fill="#F1F5F9"/>
    <text x="32" y="226" fill="#475569" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">8pt Grid System • WCAG AAA</text>
  </g>

  <!-- Right: Mobile Wireframe & Prototype Mockup -->
  <g transform="translate(340, 40)" filter="url(#ui-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="180" height="280" rx="24" fill="url(#ui-phone)" stroke="#334155" stroke-width="4"/>
    <!-- Speaker Notch -->
    <rect x="60" y="8" width="60" height="6" rx="3" fill="#334155"/>

    <!-- Screen UI Elements -->
    <g transform="translate(15, 25)">
      <!-- App Header -->
      <circle cx="15" cy="15" r="12" fill="#E2E8F0"/>
      <rect x="35" y="10" width="80" height="10" rx="4" fill="#64748B"/>

      <!-- Hero Banner -->
      <rect x="0" y="38" width="150" height="65" rx="10" fill="url(#ui-accent)"/>
      <rect x="12" y="55" width="85" height="8" rx="3" fill="#FFFFFF"/>
      <rect x="12" y="70" width="55" height="6" rx="3" fill="#FFE4E6"/>

      <!-- Content Cards -->
      <rect x="0" y="115" width="150" height="42" rx="8" fill="#1E293B"/>
      <circle cx="20" cy="136" r="12" fill="#38BDF8"/>
      <rect x="42" y="128" width="70" height="7" rx="3" fill="#F8FAFC"/>
      <rect x="42" y="140" width="45" height="5" rx="2" fill="#64748B"/>

      <rect x="0" y="165" width="150" height="42" rx="8" fill="#1E293B"/>
      <circle cx="20" cy="186" r="12" fill="#A855F7"/>
      <rect x="42" y="178" width="60" height="7" rx="3" fill="#F8FAFC"/>
      <rect x="42" y="190" width="40" height="5" rx="2" fill="#64748B"/>

      <!-- CTA Button -->
      <rect x="0" y="218" width="150" height="26" rx="6" fill="#F43F5E"/>
      <text x="75" y="235" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Get Started</text>
    </g>

    <!-- Vector Cursor Arrow -->
    <g transform="translate(130, 190)">
      <polygon points="0,0 0,22 6,17 12,25 15,23 9,15 17,15" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    </g>
  </g>
</svg>
