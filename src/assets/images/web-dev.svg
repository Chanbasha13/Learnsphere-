<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="wd-window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="wd-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="wd-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" rx="16" fill="url(#wd-bg)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Floating Glow Orbs -->
  <circle cx="500" cy="70" r="100" fill="#60A5FA" opacity="0.25" filter="blur(20px)"/>
  <circle cx="80" cy="300" r="80" fill="#93C5FD" opacity="0.2" filter="blur(16px)"/>

  <!-- Browser Window Frame -->
  <g filter="url(#wd-shadow)">
    <rect x="70" y="45" width="460" height="270" rx="12" fill="url(#wd-window)"/>
    
    <!-- Title Bar -->
    <rect x="70" y="45" width="460" height="36" rx="12" fill="#334155"/>
    <rect x="70" y="69" width="460" height="12" fill="#334155"/>
    
    <!-- Window Controls -->
    <circle cx="95" cy="63" r="6" fill="#EF4444"/>
    <circle cx="115" cy="63" r="6" fill="#F59E0B"/>
    <circle cx="135" cy="63" r="6" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="165" y="53" width="220" height="20" rx="6" fill="#1E293B"/>
    <text x="235" y="67" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">https://learnsphere.dev</text>

    <!-- Code Editor Area -->
    <!-- Left Sidebar -->
    <rect x="70" y="81" width="100" height="234" fill="#0F172A" opacity="0.6"/>
    <text x="85" y="105" fill="#64748B" font-family="monospace" font-size="11">EXPLORER</text>
    <text x="95" y="130" fill="#38BDF8" font-family="monospace" font-size="11">index.html</text>
    <text x="95" y="152" fill="#818CF8" font-family="monospace" font-size="11">style.css</text>
    <text x="95" y="174" fill="#FBBF24" font-family="monospace" font-size="11">app.js</text>

    <!-- Editor Lines -->
    <g font-family="monospace" font-size="12">
      <!-- Line 1 -->
      <text x="185" y="115" fill="#F43F5E">&lt;<tspan fill="#F43F5E">section</tspan> <tspan fill="#FBBF24">class</tspan>=<tspan fill="#34D399">"hero"</tspan>&gt;</text>
      <!-- Line 2 -->
      <text x="200" y="138" fill="#F43F5E">&lt;<tspan fill="#F43F5E">h1</tspan>&gt;<tspan fill="#F8FAFC">Master Modern Web</tspan>&lt;/<tspan fill="#F43F5E">h1</tspan>&gt;</text>
      <!-- Line 3 -->
      <text x="200" y="161" fill="#F43F5E">&lt;<tspan fill="#F43F5E">p</tspan>&gt;<tspan fill="#94A3B8">Build responsive websites</tspan>&lt;/<tspan fill="#F43F5E">p</tspan>&gt;</text>
      <!-- Line 4 -->
      <text x="185" y="184" fill="#F43F5E">&lt;/<tspan fill="#F43F5E">section</tspan>&gt;</text>
      <!-- Line 5: JS snippet -->
      <text x="185" y="215" fill="#818CF8">const <tspan fill="#38BDF8">course</tspan> = <tspan fill="#F8FAFC">{</tspan></text>
      <text x="200" y="235" fill="#94A3B8">title: <tspan fill="#34D399">"Fullstack Web"</tspan>,</text>
      <text x="200" y="255" fill="#94A3B8">skills: [<tspan fill="#34D399">"HTML5"</tspan>, <tspan fill="#34D399">"CSS3"</tspan>, <tspan fill="#34D399">"JS"</tspan>]</text>
      <text x="185" y="275" fill="#F8FAFC">};</text>
    </g>

    <!-- Floating Badge: HTML5 & CSS3 -->
    <g transform="translate(380, 160)">
      <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" opacity="0.95"/>
      <circle cx="22" cy="21" r="12" fill="#E44D26"/>
      <text x="18" y="25" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="11">5</text>
      <text x="42" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">HTML / CSS</text>
    </g>

    <g transform="translate(380, 215)">
      <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5" opacity="0.95"/>
      <circle cx="22" cy="21" r="12" fill="#F7DF1E"/>
      <text x="15" y="25" fill="#000000" font-family="sans-serif" font-weight="900" font-size="11">JS</text>
      <text x="42" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">JavaScript</text>
    </g>
  </g>
</svg>
