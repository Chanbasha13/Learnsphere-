<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="db-cyl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="db-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#db-bg)"/>

  <!-- Left: Database Cylinders Stack -->
  <g transform="translate(70, 70)" filter="url(#db-shadow)">
    <!-- Cylinder 1 (Bottom) -->
    <g transform="translate(0, 140)">
      <path d="M 0 20 L 0 60 C 0 80 180 80 180 60 L 180 20 Z" fill="url(#db-cyl)"/>
      <ellipse cx="90" cy="20" rx="90" ry="20" fill="#6EE7B7"/>
      <ellipse cx="90" cy="60" rx="90" ry="20" fill="#059669" opacity="0.4"/>
      <!-- Status light -->
      <circle cx="150" cy="40" r="5" fill="#A7F3D0"/>
    </g>

    <!-- Cylinder 2 (Middle) -->
    <g transform="translate(0, 70)">
      <path d="M 0 20 L 0 60 C 0 80 180 80 180 60 L 180 20 Z" fill="url(#db-cyl)"/>
      <ellipse cx="90" cy="20" rx="90" ry="20" fill="#6EE7B7"/>
      <ellipse cx="90" cy="60" rx="90" ry="20" fill="#059669" opacity="0.4"/>
      <circle cx="150" cy="40" r="5" fill="#A7F3D0"/>
    </g>

    <!-- Cylinder 3 (Top) -->
    <g transform="translate(0, 0)">
      <path d="M 0 20 L 0 60 C 0 80 180 80 180 60 L 180 20 Z" fill="url(#db-cyl)"/>
      <ellipse cx="90" cy="20" rx="90" ry="20" fill="#6EE7B7"/>
      <circle cx="150" cy="40" r="5" fill="#A7F3D0"/>
    </g>
  </g>

  <!-- Right: SQL Query & Relational Table Card -->
  <g transform="translate(300, 50)" filter="url(#db-shadow)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="245" height="255" rx="12" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="32" rx="12" fill="#064E3B"/>
    <text x="15" y="21" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">POSTGRESQL / SQL CONSOLE</text>

    <!-- SQL Code -->
    <g font-family="monospace" font-size="11">
      <text x="15" y="60" fill="#38BDF8">SELECT <tspan fill="#F8FAFC">u.name, c.title</tspan></text>
      <text x="15" y="80" fill="#38BDF8">FROM <tspan fill="#F8FAFC">users u</tspan></text>
      <text x="15" y="100" fill="#38BDF8">JOIN <tspan fill="#F8FAFC">enrollments e </tspan><tspan fill="#38BDF8">ON</tspan><tspan fill="#F8FAFC"> u.id = e.uid</tspan></text>
      <text x="15" y="120" fill="#38BDF8">WHERE <tspan fill="#F8FAFC">e.status = </tspan><tspan fill="#FBBF24">'active'</tspan>;</text>
    </g>

    <!-- Table Graphic -->
    <g transform="translate(15, 140)">
      <!-- Table Header -->
      <rect x="0" y="0" width="215" height="24" rx="4" fill="#1E293B"/>
      <text x="10" y="16" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="bold">id</text>
      <text x="50" y="16" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="bold">student</text>
      <text x="135" y="16" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="bold">course</text>

      <!-- Row 1 -->
      <rect x="0" y="28" width="215" height="22" rx="3" fill="#111827"/>
      <text x="10" y="43" fill="#F8FAFC" font-family="monospace" font-size="10">1</text>
      <text x="50" y="43" fill="#34D399" font-family="monospace" font-size="10">Sarah J.</text>
      <text x="135" y="43" fill="#60A5FA" font-family="monospace" font-size="10">Web Dev</text>

      <!-- Row 2 -->
      <rect x="0" y="54" width="215" height="22" rx="3" fill="#111827"/>
      <text x="10" y="69" fill="#F8FAFC" font-family="monospace" font-size="10">2</text>
      <text x="50" y="69" fill="#34D399" font-family="monospace" font-size="10">Alex M.</text>
      <text x="135" y="69" fill="#60A5FA" font-family="monospace" font-size="10">Python</text>

      <!-- Status Footer -->
      <text x="0" y="98" fill="#10B981" font-family="monospace" font-size="10">✓ 2 rows retrieved (3.2 ms)</text>
    </g>
  </g>
</svg>
