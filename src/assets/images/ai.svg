<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="50%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ai-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="ai-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#ai-bg)"/>

  <!-- Neural Network Background Lines -->
  <g opacity="0.3" stroke="#A855F7" stroke-width="1.5">
    <line x1="80" y1="80" x2="200" y2="120"/>
    <line x1="80" y1="180" x2="200" y2="120"/>
    <line x1="80" y1="280" x2="200" y2="120"/>
    <line x1="80" y1="80" x2="200" y2="240"/>
    <line x1="80" y1="180" x2="200" y2="240"/>
    <line x1="80" y1="280" x2="200" y2="240"/>
    <line x1="200" y1="120" x2="320" y2="180"/>
    <line x1="200" y1="240" x2="320" y2="180"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="80" cy="80" r="8" fill="#EC4899"/>
  <circle cx="80" cy="180" r="8" fill="#EC4899"/>
  <circle cx="80" cy="280" r="8" fill="#EC4899"/>
  <circle cx="200" cy="120" r="10" fill="#06B6D4"/>
  <circle cx="200" cy="240" r="10" fill="#06B6D4"/>
  <circle cx="320" cy="180" r="12" fill="#FDE047"/>

  <!-- AI Brain / Chip Center Graphic -->
  <g transform="translate(320, 60)" filter="url(#ai-shadow)">
    <!-- Circuit Base Chip -->
    <rect x="30" y="30" width="180" height="180" rx="20" fill="#0F172A" stroke="url(#ai-glow)" stroke-width="3"/>
    
    <!-- Chip Pins -->
    <g stroke="#C084FC" stroke-width="3" stroke-linecap="round">
      <line x1="60" y1="30" x2="60" y2="15"/>
      <line x1="90" y1="30" x2="90" y2="15"/>
      <line x1="120" y1="30" x2="120" y2="15"/>
      <line x1="150" y1="30" x2="150" y2="15"/>
      <line x1="180" y1="30" x2="180" y2="15"/>

      <line x1="60" y1="210" x2="60" y2="225"/>
      <line x1="90" y1="210" x2="90" y2="225"/>
      <line x1="120" y1="210" x2="120" y2="225"/>
      <line x1="150" y1="210" x2="150" y2="225"/>
      <line x1="180" y1="210" x2="180" y2="225"/>

      <line x1="30" y1="60" x2="15" y2="60"/>
      <line x1="30" y1="90" x2="15" y2="90"/>
      <line x1="30" y1="120" x2="15" y2="120"/>
      <line x1="30" y1="150" x2="15" y2="150"/>
      <line x1="30" y1="180" x2="15" y2="180"/>

      <line x1="210" y1="60" x2="225" y2="60"/>
      <line x1="210" y1="90" x2="225" y2="90"/>
      <line x1="210" y1="120" x2="225" y2="120"/>
      <line x1="210" y1="150" x2="225" y2="150"/>
      <line x1="210" y1="180" x2="225" y2="180"/>
    </g>

    <!-- Glowing Core -->
    <rect x="55" y="55" width="130" height="130" rx="14" fill="url(#ai-glow)" opacity="0.15"/>
    
    <!-- Stylized AI Brain Outline -->
    <g transform="translate(70, 70)" stroke="#F472B6" stroke-width="2.5" fill="none">
      <!-- Left Hemisphere -->
      <path d="M 50 15 C 30 15 15 30 15 50 C 15 65 25 75 25 85 C 25 95 35 100 50 100"/>
      <path d="M 25 40 Q 40 45 50 35"/>
      <path d="M 18 65 Q 35 60 50 70"/>
      <!-- Right Hemisphere (Circuits) -->
      <path d="M 50 15 C 70 15 85 30 85 50 C 85 65 75 75 75 85 C 75 95 65 100 50 100"/>
      <circle cx="70" cy="40" r="4" fill="#38BDF8"/>
      <line x1="50" y1="35" x2="66" y2="40"/>
      <circle cx="80" cy="65" r="4" fill="#38BDF8"/>
      <line x1="50" y1="70" x2="76" y2="65"/>
      <circle cx="65" cy="88" r="4" fill="#38BDF8"/>
      <line x1="50" y1="85" x2="61" y2="88"/>
    </g>

    <text x="120" y="260" fill="#E9D5FF" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">Neural Networks &amp; LLMs</text>
  </g>

  <!-- Left Code & Accuracy Card -->
  <g transform="translate(50, 60)" filter="url(#ai-shadow)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="#0F172A" stroke="#7E22CE" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="32" rx="12" fill="#1E1B4B"/>
    <text x="15" y="21" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">TENSORFLOW MODEL</text>

    <g font-family="monospace" font-size="11">
      <text x="15" y="60" fill="#F43F5E">model = Sequential([</text>
      <text x="25" y="80" fill="#38BDF8">Dense(128, 'relu'),</text>
      <text x="25" y="100" fill="#38BDF8">Dropout(0.2),</text>
      <text x="25" y="120" fill="#38BDF8">Dense(10, 'softmax')</text>
      <text x="15" y="140" fill="#F43F5E">])</text>
      
      <line x1="15" y1="160" x2="205" y2="160" stroke="#334155"/>
      <text x="15" y="185" fill="#94A3B8">Epoch 50/50 - Val Acc:</text>
      <text x="15" y="208" fill="#34D399" font-size="16" font-weight="bold">98.4% Accuracy</text>
    </g>
  </g>
</svg>
